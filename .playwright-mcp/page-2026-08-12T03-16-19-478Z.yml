      - generic [ref=f35e256]:
        - generic [ref=f35e257]: Аналізи на вірусні гепатити (A, B, C, D)
        - generic [ref=f35e258]:
          - paragraph [ref=f35e259]: "Гепатит - це запальне захворювання печінки, що може мати різноманітну етіологію: вірусну, токсичну, аутоімунну чи метаболічну. Хвороба при несвоєчасному лікуванні може прогресувати до фіброзу, цирозу або гепатоцелюлярної карциноми. Вірусний гепатит залишається однією з найпоширеніших причин ураження печінки по всьому світу."
          - paragraph [ref=f35e260]: Лабораторна діагностика відіграє важливу роль у виявленні хвороби на ранніх стадіях. Своєчасне проведення аналізу на гепатит дозволяє не лише встановити діагноз, але й визначити тип вірусу, стадію захворювання та активність інфекційного процесу.
          - heading "Коли необхідне тестування на гепатит" [level=2] [ref=f35e261]
          - paragraph [ref=f35e262]: "Тест на гепатит рекомендовано пройти у таких випадках:"
          - heading "При появі клінічних симптомів ураження печінки:" [level=3] [ref=f35e263]
          - list [ref=f35e264]:
            - listitem [ref=f35e265]: Жовтяниця шкіри та склер
            - listitem [ref=f35e266]: Темний колір сечі та світлий кал
            - listitem [ref=f35e267]: Біль або дискомфорт у правому підребер'ї
            - listitem [ref=f35e268]: Нудота, блювання, втрата апетиту
            - listitem [ref=f35e269]: Необґрунтована слабкість, втомлюваність
          - heading "Для профілактичного обстеження:" [level=3] [ref=f35e270]
          - list [ref=f35e271]:
            - listitem [ref=f35e272]: Планові медичні огляди
            - listitem [ref=f35e273]: Обстеження перед оперативними втручаннями
            - listitem [ref=f35e274]: Підготовка до вагітності
            - listitem [ref=f35e275]: Донорство крові та органів
            - listitem [ref=f35e276]: Медичні працівники та особи з підвищеним ризиком інфікування
          - heading "Для динамічного лабораторного спостереження за перебігом захворювання:" [level=3] [ref=f35e277]
          - list [ref=f35e278]:
            - listitem [ref=f35e279]: Контроль ефективності противірусної терапії
            - listitem [ref=f35e280]: Оцінка динаміки захворювання
            - listitem [ref=f35e281]: Виявлення рецидивів
          - heading "Види лабораторних аналізів на гепатит у CSD LAB" [level=2] [ref=f35e282]
          - heading "Серологічні дослідження" [level=3] [ref=f35e283]
          - paragraph [ref=f35e284]: "Серологічні тести на гепатит дозволяють виявити антигени вірусів та специфічні антитіла:"
          - paragraph [ref=f35e285]:
            - strong [ref=f35e286]: "Маркери гепатиту B:"
          - list [ref=f35e287]:
            - listitem [ref=f35e288]: HBsAg (поверхневий антиген) - основний маркер інфікування
            - listitem [ref=f35e289]: Anti-HBc (ядрові антитіла) - свідчать про наявність інфекції
            - listitem [ref=f35e290]: HBeAg та Anti-HBe - характеризують активність реплікації вірусу
          - paragraph [ref=f35e291]:
            - strong [ref=f35e292]: "Маркери гепатиту C:"
          - list [ref=f35e293]:
            - listitem [ref=f35e294]: Anti-HCV - вказує на контакт із вірусом
            - listitem [ref=f35e295]: Core-antigen - свідчить про активну реплікацію
          - paragraph [ref=f35e296]:
            - strong [ref=f35e297]: "Маркери гепатиту A:"
          - list [ref=f35e298]:
            - listitem [ref=f35e299]: Anti-HAV IgM - гостра інфекція
            - listitem [ref=f35e300]: Anti-HAV IgG - перенесене захворювання
          - heading "Молекулярно-генетичні методи (ПЛР)" [level=3] [ref=f35e301]
          - paragraph [ref=f35e302]: "Аналіз крові на гепатит методом ПЛР дозволяє:"
          - list [ref=f35e303]:
            - listitem [ref=f35e304]: Виявити ДНК/РНК вірусу в крові
            - listitem [ref=f35e305]: Визначити вірусне навантаження
            - listitem [ref=f35e306]: Проводити генотипування вірусів
            - listitem [ref=f35e307]: Моніторити ефективність лікування
          - heading "Біохімічні дослідження" [level=3] [ref=f35e308]
          - paragraph [ref=f35e309]: "Аналіз гепатит включає оцінку функції печінки:"
          - list [ref=f35e310]:
            - listitem [ref=f35e311]: АЛТ (аланінамінотрансфераза)
            - listitem [ref=f35e312]: АСТ (аспартатамінотрансфераза)
            - listitem [ref=f35e313]: Білірубін (загальний, прямий)
            - listitem [ref=f35e314]: Загальний білок та фракції
            - listitem [ref=f35e315]: ГГТ (гама-глутамілтрансфераза)
          - heading "Значення лабораторної діагностики в лікуванні гепатиту" [level=2] [ref=f35e316]
          - paragraph [ref=f35e317]: "Комплексна діагностика гепатитів дозволяє:"
          - list [ref=f35e318]:
            - listitem [ref=f35e319]: Встановити точний діагноз та визначити етіологію захворювання
            - listitem [ref=f35e320]: Оцінити активність і стадію патологічного процесу
            - listitem [ref=f35e321]: Контролювати ефективність терапії
            - listitem [ref=f35e322]: Прогнозувати перебіг захворювання
            - listitem [ref=f35e323]: Виявляти ускладнення на ранніх стадіях
          - paragraph [ref=f35e324]: Здача крові на гепатит для ПЛР-дослідження дозволяє точно оцінити вірусне навантаження, що є важливим лабораторним показником, який використовується лікарем при оцінці перебігу захворювання.
          - heading "Підготовка до здачі аналізів" [level=2] [ref=f35e325]
          - paragraph [ref=f35e326]: "Для отримання достовірних результатів аналізів на гепатит рекомендується:"
          - list [ref=f35e327]:
            - listitem [ref=f35e328]: Здавати кров вранці натщесерце (8-12 годин голодування)
            - listitem [ref=f35e329]: Уникнути вживання алкоголю за 48 годин до дослідження
            - listitem [ref=f35e330]: Повідомити лікаря про прийом лікарських препаратів
            - listitem [ref=f35e331]: Уникнути інтенсивного фізичного навантаження перед дослідженням
            - listitem [ref=f35e332]: Не палити за 1-2 години до здачі крові
          - heading "Інтерпретація результатів аналізів на гепатит" [level=2] [ref=f35e333]
          - paragraph [ref=f35e334]: "Інтерпретацію результатів гепатит тесту проводить лікар з урахуванням клінічної картини та анамнезу:"
          - list [ref=f35e335]:
            - listitem [ref=f35e336]: Позитивний HBsAg свідчить про наявність інфекції гепатиту B
            - listitem [ref=f35e337]: Позитивний Anti-HCV вказує на контакт із вірусом гепатиту C
            - listitem [ref=f35e338]: Виявлення ДНК/РНК вірусу підтверджує активну реплікацію збудника
            - listitem [ref=f35e339]: Підвищення АЛТ/АСТ свідчить про цитоліз гепатоцитів
          - paragraph [ref=f35e340]: "При отриманні позитивних результатів рекомендовано:"
          - list [ref=f35e341]:
            - listitem [ref=f35e342]: Повторне підтверджувальне тестування
            - listitem [ref=f35e343]: Консультація інфекціоніста або гастроентеролога
            - listitem [ref=f35e344]: Додаткові обстеження для оцінки стану печінки
            - listitem [ref=f35e345]: Обстеження контактних осіб
          - heading "Переваги лабораторної діагностики гепатиту в CSD LAB" [level=2] [ref=f35e346]
          - paragraph [ref=f35e347]: "Лабораторія CSD пропонує повний спектр досліджень для діагностики гепатитів:"
          - list [ref=f35e348]:
            - listitem [ref=f35e349]: Сучасне обладнання провідних виробників
            - listitem [ref=f35e350]: Високочутливі та специфічні тест-системи
            - listitem [ref=f35e351]: Дотримання міжнародних стандартів якості
            - listitem [ref=f35e352]: Швидкі терміни виконання досліджень
            - listitem [ref=f35e353]: Конфіденційність результатів
            - listitem [ref=f35e354]: Професійна консультація фахівців
          - paragraph [ref=f35e355]: Ціна аналіза на гепатит є доступною для різних категорій пацієнтів. Скільки коштує дослідження можна дізнатися на сайті або у контакт-центрі лабораторії.
          - heading "Як замовити аналізи на гепатит у CSD LAB" [level=2] [ref=f35e356]
          - paragraph [ref=f35e357]: "Здати аналіз на гепатит у лабораторії можна кількома способами:"
          - list [ref=f35e358]:
            - listitem [ref=f35e359]: Онлайн-запис через форму на сайті
            - listitem [ref=f35e360]: За телефонами контакт-центру
            - listitem [ref=f35e361]: Безпосередньо у відділеннях лабораторії
          - paragraph [ref=f35e362]: "Результати досліджень видаються у зручному форматі:"
          - list [ref=f35e363]:
            - listitem [ref=f35e364]: Електронною поштою
            - listitem [ref=f35e365]: Через особистий кабінет на сайті
            - listitem [ref=f35e366]: У паперовому вигляді у відділенні
          - paragraph [ref=f35e367]: Своєчасна діагностика гепатитів є важливим етапом у веденні пацієнтів та запобігання серйозних ускладнень. Регулярне проходження профілактичних обстежень дозволяє виявити захворювання на ранніх стадіях, коли лікування найбільш ефективне.
          - paragraph [ref=f35e368]: У лабораторії CSD проводяться лабораторні дослідження крові на гепатити відповідно до встановлених методик. Результати аналізів є лабораторною інформацією, що враховується лікарем під час клінічного прийняття рішень.
          - paragraph [ref=f35e369]: Не відкладайте обстеження на потім - дбайте про своє здоров'я вчасно!
