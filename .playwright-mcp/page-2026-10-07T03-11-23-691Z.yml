              - /url: https://nobelprizemedicine.org
            - text: "has decided to award the 2026 Nobel Prize in Physiology or Medicine jointly to:"
          - paragraph [ref=e71]:
            - strong [ref=e72]: KARL DEISSEROTH
            - text: The Howard Hughes Medical Institute and Stanford University, USA
          - paragraph [ref=e73]:
            - strong [ref=e74]: PETER HEGEMANN
            - text: Humboldt University of Berlin, Germany
