            - strong [ref=e76]: GEORG NAGEL
            - text: University of Würzburg, Germany
          - paragraph [ref=e77]:
            - emphasis [ref=e78]: “for their discoveries concerning light-gated ion channels and optogenetics”
          - heading "Light-seeking algae gave us a switch for nerve cells" [level=2] [ref=e79]
          - paragraph [ref=e80]: The Nobel Prize in Physiology or Medicine 2026 is awarded for optogenetics — a method that makes it possible to show how nerve cells shape memories, feelings and behaviours in the living brain. Peter Hegemann and Georg Nagel discovered a remarkable protein, channelrhodopsin, in a single-celled alga. Karl Deisseroth transformed the protein into a light-controlled switch for nerve cells. The laureates have laid the foundation of a new era in neuroscience.
          - paragraph [ref=e81]: The Nobel Prize in Physiology or Medicine 2026 is awarded for optogenetics — a method that makes it possible to show how nerve cells shape memories, feelings and behaviours in the living brain. Peter Hegemann and Georg Nagel discovered a remarkable protein, channelrhodopsin, in a single-celled alga. Karl Deisseroth transformed the protein into a light-controlled switch for nerve cells. The Laureates have laid the foundation of a new era in neuroscience.
          - paragraph [ref=e82]: How the brain governs feelings, behaviours and bodily functions has long been a mystery. In the 20th century, researchers began to investigate which areas of the brain affect which functions, but the methods used meant they could not prove causal relationships. The image they developed of the brain was like a sketch map, full of question marks and unknowns. Now all this is changing.
          - paragraph [ref=e83]: “Optogenetics provides opportunities for mapping the brain in a way that we could once only dream of,” says Per Svenningsson, Chair of the Nobel Committee for Physiology or Medicine.
          - paragraph [ref=e84]:
            - text: It all began with Peter Hegemann’s curiosity. He wondered how
            - emphasis [ref=e85]: Chlamydomonas
            - text: ", a single-celled alga, is able to swim towards a light source. In the early 2000s, he and Georg Nagel discovered channelrhodopsin, an algal protein with unique properties, found on the surface of the cell. When it is illuminated by blue light, a channel opens through the protein. Charged ions then flow into the cell, creating an electrical impulse. They found that regardless of which cell they put the protein in, those cells became light sensitive."
          - paragraph [ref=e86]: Karl Deisseroth introduced the gene for channel-rhodopsin into nerve cells from rats. By illuminating the cells with blue light, he was able to trigger a nerve signal. He published this breakthrough in 2005. Two years later, he made this light-controlled switch for nerve cells work in the brains of living mice.
          - paragraph [ref=e87]: This method for controlling nerve signals with light is now called optogenetics, and it has rapidly gained global impact. Using optogenetics, researchers have been able to reveal neural circuits governing specific memories, feelings, and behaviours relevant for neurological and psychiatric disorders. In clinical medicine, researchers are using the method in attempts to restore sight in people with visual impairment.
          - paragraph [ref=e88]: "Optogenetics has fundamentally altered our understanding of the brain. Every day brings new discoveries, helping to solve one of humanity’s great mysteries: how our incredible brain works."
