            - generic [ref=f28e286]:
              - generic [ref=f28e287]:
                - paragraph [ref=f28e288]: Вітамін D3 4000 МО (IU) добавка дієтична Vitamin D3.
                - generic [ref=f28e289]:
                  - generic [ref=f28e290] [cursor=pointer]:
                    - heading "Активні компоненти" [level=2] [ref=f28e291]
                    - text: 
                  - generic [ref=f28e293]:
                    - paragraph [ref=f28e294]: Вітамін D3 (холекальциферол) - життєво важливий жиророзчинний вітамін, необхідний для забезпечення діяльності практично всіх органів і систем людського організму.
                    - paragraph [ref=f28e295]: Вітамін D3 регулює біля 3% геному людини, включно гени інсулінового рецептора та стероїдогенезу (синтезу всіх стероїдних та полових гормонів).
                    - paragraph [ref=f28e296]: Дефіцит Вітамін D3 може бути фактором ризику розвитку метаболічного синдрому.
                    - paragraph [ref=f28e297]: Вітамін D3 має захисний ефект на функцію ендотелію шляхом стимулюванню синтезу NO та зниженню утворення активних форм кисню.
                    - list [ref=f28e298]:
                      - listitem [ref=f28e299]: "Кісткова система. Вітамін D3 бере участь в регуляції фосфорно-кальцієвого обміну: сприяє засвоєнню кальцію в кишківнику, підтримує необхідний рівень кальцію та фосфору в крові, активізує кістковий метаболізм. Сприяє забезпеченню міцності кісток і зубів, зниженню ризику розвитку рахіту, остеомаляції."
                      - listitem [ref=f28e300]: Ендокринна система. Вітамін D3 впливає на метаболізм глюкози і інсуліну, а дефіцит вітаміну D3 є фактором ризику для розвитку інсулінорезистентності, порушення толерантності до глюкози. Вітамін D3 може стимулювати секрецію інсуліну бета-клітинами підшлункової залози, а також опосередковано активує кальцій-залежну ендопептідазу бета-клітин, яка перетворює проінсулін в активний інсулін. Вітамін D3 може впливати на чутливість тканин до інсуліну безпосередньо, стимулюючи експресію рецепторів інсуліну в клітинах. Вітамін D3 позитивно впливає на ліпідний обмін, сприяючи зниженню в крові рівня загального холестерину, тригліцеридів та ліпідів низької щільності. Вітамін D3 відіграє істотну роль в корекції ожиріння і перебігу метаболічного синдрому.
                      - listitem [ref=f28e301]: "Репродуктивна функція. Вітамін D3 стимулює синтез жіночих і чоловічих статевих гормонів: естрогену, прогестерону, тестостерону. Вітамін D3 позитивно впливає на репродуктивну функцію, як жінок, так і чоловіків. Рекомендується для застосування у пар, які планують вагітність або зазнають труднощів при зачатті дитини. У жінок з достатнім рівнем вітаміну D3 запліднення яйцеклітин відбувається частіше. Нормальний рівень вітаміну D дозволяє поліпшити результати екстракорпорального запліднення. Найімовірніше, цей ефект обумовлений впливом вітаміну D3 на ендометрій. Прийом вітаміну D3 дозволяє підвищити товщину ендометрія у жінок з синдромом полікістозних яєчників. Розвиток аденоми передміхурової залози (АПЗ) достовірно асоціюється з дефіцитом/недостатністю Вітаміну D3, згідно з наявними даними клінікоепідеміологічних досліджень."
                      - listitem [ref=f28e302]: "Імунна система. Вітамін D3 сприяє активації захисної функції організму, позитивно впливаючи як на вроджений, так і набутий імунітет. Вітамін D3 запускає в організмі синтез власних антимікробних пептидів: кателіцидинів і дефензинів. Вітамін D3 сприяє зниженню ризику розвитку застудних захворювань. Вітамін D3 забезпечує регулюючий вплив на зростання, розвиток та оновлення клітин імунної системи. Нестача вітаміну D3 в організмі може призводити до послаблення імунного захисту організму."
                      - listitem [ref=f28e303]: Органи чуття. Розвиток діабетичної ретинопатії, як найбільш розповсюдженої причини сліпоти, та макулодистрофії (вікова макулярна дегенерація) пов’язані з дефіцитом вітаміну D.
                      - listitem [ref=f28e304]: Розвиток та важкість перебігу синдрому сухого ока пов’язано з дефіцитом/недостатністю
                      - listitem [ref=f28e305]: вітаміну D в організмі. Доведено, що додавання вітаміну D до раціону пацієнтів з синдромом сухого ока сприяло секреції сльози, зменшенню нестійкості сльози та зменшенню запалення поверхні очей.
                      - listitem [ref=f28e306]: Онкогенез. Вітамін D3 та його метаболіти можуть знижувати вірогідність розвитку різних видів раку (найбільш масштабні дослідження були проведені стосовно раку молочної залози та колоректального раку).16,17,18 Вітамін D3 здатний пригнічувати пухлинний ангіогенез (утворення нових кровоносних судин у тканинах пухлини), посилювати міжклітинні взаємодії та за рахунок цього уповільнювати проліферацію (розростання тканини шляхом інтенсивного поділу клітин), крім цього допомагає підтримувати нормальний градієнт кальцію в клітинах, що є важливим чинником для процесів нормальної диференціації клітин, також вітамін D3 сприяє зменшенню проліферації клітин, які ще не є пухлинними, але є високо ризиковими.
                      - listitem [ref=f28e307]: "Нервова система. Вітамін D3 Позитивно впливає на діяльність нервової системи, у тому числі психо-емоційну сферу та когнітивні функції: настрій, пам'ять, увагу, працездатність, загальний тонус організму. Вітамін D3 бере участь у синтезі нейромедіаторів - біологічно активних речовин, за допомогою яких здійснюється передача імпульсів між нервовими клітинами20. Вітамін D3 здатний надавати позитивний вплив на синтез серотоніну та допаміну, які мають величезне значення для нормального психо-емоційного стану людини."
                      - listitem [ref=f28e308]: "Серцево-судинна система. Вітамін D3 є важливим фактором нормального функціонування серцево-судинної системи. Вітамін D3 позитивно впливає на важливі фактори протидії розвитку артеріальної гіпертензії: нормальне функціонування ендотелію, стан м'язової стінки судин та на процеси згортання крові."
                      - listitem [ref=f28e309]: Регулювання енергетичного потенціалу клітин. Вітамін D3 сприяє зняттю втоми і підвищенню тонусу організму через регулювання власного енергетичного потенціалу клітин. В результаті впливу вітаміну D3 в мітохондріях клітин підвищується синтез АТФ (аденозинтрифосфату), який є власним універсальним джерелом енергії для всіх біохімічних процесів, що протікають в організмі.
                      - listitem [ref=f28e310]: М'язова система. Вітамін D3 сприяє підтримці сили м'язів і нервово-м'язової провідності26, завдяки чому знижує ризик падінь та переломів.
                      - listitem [ref=f28e311]: Бронхо-легенева система. Вітамін D3 сприяє запобіганню патологічних змін гладких м'язів повітроносних шляхів, регулює скорочення м'язів дихальних шляхів і запальну відповідь, що сприяє нормальному функціонуванню легенів.
