              - heading "Hidden habits that make your social anxiety worse - and how to break them" [level=1] [ref=e124]
              - figure "Image caption, Overcoming social anxiety can be tricky but experts have shared some tips to try and make it easier" [ref=e128]:
                - generic [ref=e129]:
                  - img "A female university student in a library wearing a demin jacket looking towards the camera with her hand on a book" [ref=e131]
                  - generic [ref=e132]:
                    - generic [ref=e133]: Image source,
                    - text: Getty Images
                - generic [ref=e134]:
                  - generic [ref=e135]: Image caption,
                  - paragraph [ref=e137]: Overcoming social anxiety can be tricky but experts have shared some tips to try and make it easier
              - generic [ref=e141]:
                - generic [ref=e142]: By
                - link [ref=e145] [cursor=pointer]:
                  - /url: https://www.bbc.co.uk/news/topics/cne6kq5e5r0t
                - generic [ref=e149]: Health correspondent
              - list [ref=e154]:
                - listitem [ref=e156]:
                  - generic [ref=e157]: Published
                  - time [ref=e161]: 30 September 2026
              - generic [ref=e165]:
                - paragraph [ref=e166]: It was during her teenage years that Mary began to become anxious in social situations. It got so bad she developed depression and had to have time off school.
                - paragraph [ref=e167]: By the time she started university, she avoided group settings altogether.
                - paragraph [ref=e168]: "\"I didn't join clubs and societies like others did,\" says Mary (not her real name). \"I just thought nobody would want to get to know me. I didn't really make a single friend during my whole degree.\""
                - paragraph [ref=e169]:
                  - text: Mary's social anxiety was so bad that she was diagnosed as having social anxiety disorder - something that
                  - link "affects up to 12% of people , external" [ref=e170] [cursor=pointer]:
                    - /url: https://www.nice.org.uk/guidance/cg159/documents/social-anxiety-disorder-final-scope2
                    - text: affects up to 12% of people
                    - generic [ref=e171]: ", external"
                  - text: at some point in their lives.
                - paragraph [ref=e172]: But plenty more report struggling more generally. As students return to uni, we asked experts how to overcome these feelings whether in your first, or final year.
              - figure "Figure caption, What makes you socially anxious?" [ref=e177]:
                - generic [ref=e185]:
                  - generic [ref=e186]: Figure caption,
                  - paragraph [ref=e188]: What makes you socially anxious?
              - generic [ref=e192]:
                - paragraph [ref=e193]:
                  - text: Research has suggested more than a fifth of university students face some kind of social anxiety during their studies – and it has been linked to lower grades, poorer relationships and isolation
                  - link "in a study by the universities of Chichester, Coventry and University College London , external" [ref=e194] [cursor=pointer]:
                    - /url: https://www.chi.ac.uk/news/anxious-students-more-likely-to-struggle-socially-and-academically-at-university-study-finds/
                    - text: in a study by the universities of Chichester, Coventry and University College London
                    - generic [ref=e195]: ", external"
                  - text: .
                - paragraph [ref=e196]: For many, university marks the first time they have moved out of home – and the expectation is that they will quickly make friends.
                - paragraph [ref=e197]: Mary, who went to the University of Exeter, says she did try. "When I first got there I went to one society, but everybody was talking to each other and I had a sudden fear come over me. I felt I wouldn't fit in and I went home."
              - heading "Signs you may be socially anxious" [level=2] [ref=e201]
              - generic [ref=e205]:
                - paragraph [ref=e206]: Mary, who is now 25, describes her social anxiety as like an out of body experience. When she was talking to new people, heat would rise in her face and her hands would begin to tingle. "I'd almost feel myself separating from my body. I forgot how to form words," she says.
                - paragraph [ref=e207]: "\"After social situations I was often left with the sense that I'd done something awful. I had an all-consuming feel of shame. I kept thinking there was something fundamentally flawed in me.\""
                - paragraph [ref=e208]: Neil Greening, chair of the Social Anxiety Alliance UK, says this is a typical characteristic of people with social anxiety.
                - paragraph [ref=e209]: "\"People think they have a personality flaw. They internalise it rather than seeing it as a recognisable condition that they can get help for.\""
                - paragraph [ref=e210]: "The key thing to remember: It's fairly normal to feel a little shy or anxious when meeting new people, being in new situations or going for a job interview. Social anxiety is when it actually stops people doing things, Greening says."
                - paragraph [ref=e211]: For those with a clinical diagnosis it can have a debilitating impact like it did for Mary.
                - paragraph [ref=e212]: "\"It can be hard to admit to any form of social anxiety in a world where extrovertism and social confidence is generally admired. Many people try to hide their social anxiety or use safety behaviours.\""
                - paragraph [ref=e213]: "Signs someone may be socially anxious:"
                - list [ref=e215]:
                  - listitem [ref=e216]:
                    - paragraph [ref=e217]: Keeping quiet
                  - listitem [ref=e218]:
                    - paragraph [ref=e219]: Giving short answers
                  - listitem [ref=e220]:
                    - paragraph [ref=e221]: Playing with a phone to avoid interacting
                  - listitem [ref=e222]:
                    - paragraph [ref=e223]: Always staying close to someone or staying on the edges of a group
                  - listitem [ref=e224]:
                    - paragraph [ref=e225]: Sticking to safe subjects of conversation like work
                - paragraph [ref=e226]: Greening says there is some evidence social anxiety is getting worse and that increased use of smartphones and remote working is contributing by "leading to less social interactions and increased levels of anxiety".
              - heading "How to help yourself" [level=2] [ref=e230]
              - generic [ref=e234]:
                - paragraph [ref=e235]: Mary, who has moved on to do a postgraduate course, is now managing her social anxiety better. After her undergraduate degree she got support from the NHS in the form of a talking therapy called CBT.
                - paragraph [ref=e236]: It is considered the gold standard treatment for social anxiety and encourages people to re-frame their thoughts and change their behaviours.
                - paragraph [ref=e237]: Prof David Clark, a psychologist at the University of Oxford, says he would like to see more people come forward for therapy but says people can also take steps to help themselves.
                - paragraph [ref=e238]: The first step, he says, is to stop obsessive self-focus. "People with social anxiety often monitor themselves constantly during social situations. Am I blushing? Do I sound stupid? Do I look nervous?
                - paragraph [ref=e239]: "\"Focus outwardly on the conversation, other person or your surroundings.\""
                - paragraph [ref=e240]: He says you also need to test your fears with behavioural experiments by asking a question in a meeting or saying something in a group and noticing what happens.
                - paragraph [ref=e241]: "\"People with social anxiety often assume negative outcomes – that they will embarrass themselves or think others will find them boring. Testing that can help people break that. It's frightening, but it can really help.\""
                - paragraph [ref=e242]: He also says they need to drop safety behaviours, such as rehearsing every sentence, avoiding eye contact or sticking close to one particular person.
                - paragraph [ref=e243]: And finally, Clark adds, try to avoid post-event rumination. "It's so easy to distort what actually happened."
                - paragraph [ref=e244]: This is something Mary can empathise with. "I used to play things over constantly in my mind. What I've learnt is that dealing with social anxiety is a gradual process. The therapy really helped me, but so did something a friend said to me a couple of years ago.
                - paragraph [ref=e245]: "\"When I said I didn't want to join her in meeting some of her friends, citing my poor social skills, she said she'd never thought that about me and that I shouldn't undersell myself. I was overcome with emotion."
                - paragraph [ref=e246]: "\"I'm now pushing myself to engage more. It helps that in my postgrad course we're in smaller groups, but I've also joined an astronomy group. It's still difficult and it doesn't always go how I want it to, but I'm learning to manage it.\""
