                - heading "Аналіз калу на приховану кров" [level=2] [ref=f63e151]
                - paragraph [ref=f63e152]: Хвороби системи травлення – поширена проблема, першим кроком в боротьбі з якими є правильна та точна діагностика. Аналіз калу на приховану кров – надійний метод діагностики, що дозволяє виявляти ерозивно-виразкові та інші патологічні процеси в органах ШКТ, а також рак товстого кишечника або прямої кишки.
                - paragraph [ref=f63e153]: Як стає ясно безпосередньо з назви, прихована кров – це присутність крові в калових масах, яку неможливо виявити візуально, в тому числі при мікроскопічному дослідженні калу. Наявність у калі такої крові характерна для прихованих, мізерних внутрішніх кровотеч у нижніх відділах шлунково-кишкового тракту, порушення цілісності слизової органів травлення. Такі стани можуть тривалий час протікати без виражених симптомів. Аналіз калу на приховану кров дозволяє виявити на ранній стадії низку небезпечних захворювань.
                - paragraph [ref=f63e154]: Одна з найбільш поширених методик аналізу калу на приховану кров – реакція Грегерсена, вона ж бензидинова проба. Це біохімічне дослідження, засноване на забарвленні реактиву при взаємодії з гемоглобіном крові, навіть якщо в зразку останній міститься в мінімальній концентрації.
                - heading "В яких випадках призначається аналіз калу на приховану кров" [level=2] [ref=f63e155]
                - paragraph [ref=f63e156]: "наліз калу на приховану кров найчастіше призначають гастроентеролог, онколог, терапевт, хірург. Аналіз калу на приховану кров – важливий інструмент скринінгу раку товстої та прямої кишки (колоректального) у пацієнтів з групи ризику. До факторів ризику належать:"
                - list [ref=f63e157]:
                  - listitem [ref=f63e158]: хвороба Крона, неспецифічний виразковий коліт (НВК), діагностовані 10 і більше років тому;
                  - listitem [ref=f63e159]: онкологічні захворювання кишечника в сімейному анамнезі;
                  - listitem [ref=f63e160]: вік старше 50 років.
                - paragraph [ref=f63e161]: "Також аналіз калу на приховану кров проводиться при низці захворювань шлунково-кишкового тракту, які супроводжуються порушенням цілісності слизової (виразкова хвороба, пухлини різних відділів, поліпи, туберкульоз кишечника, глистяні інвазії, неспецифічний виразковий коліт тощо):"
                - list [ref=f63e162]:
                  - listitem [ref=f63e163]: для первинної діагностики;
                  - listitem [ref=f63e164]: для оцінки ступеня пошкодження слизової, тяжкості захворювання, діагностованого іншими методами;
                  - listitem [ref=f63e165]: для оцінки ефективності терапії.
                - paragraph [ref=f63e166]: "Основні показання до призначення аналізу калу на приховану кров (реакції Грегерсена):"
                - list [ref=f63e167]:
                  - listitem [ref=f63e168]: болі в животі, нудота, блювота, печія;
                  - listitem [ref=f63e169]: порушення дефекації – закрепи, кашкоподібні випорожнення, хибні позиви;
                  - listitem [ref=f63e170]: втрата апетиту, ваги, тривале підвищення температури.
                - heading "Що означають результати аналізу калу на приховану кров" [level=2] [ref=f63e171]
                - paragraph [ref=f63e172]: "Негативний результат аналізу калу на приховану кров не має діагностичного значення. Позитивна реакція Грегерсена може вказувати на:"
                - list [ref=f63e173]:
                  - listitem [ref=f63e174]: колоректальний рак;
                  - listitem [ref=f63e175]: пухлини різних відділів травного тракту, як первинні, так і метастатичні;
                  - listitem [ref=f63e176]: виразкову хворобу;
                  - listitem [ref=f63e177]: НВК;
                  - listitem [ref=f63e178]: ерозивний езофагіт (запалення слизової стравоходу);
                  - listitem [ref=f63e179]: захворювання, які супроводжуються розширенням вен стравоходу;
                  - listitem [ref=f63e180]: механічне травмування стінок кишечника гельмінтами;
                  - listitem [ref=f63e181]: туберкульоз кишечника;
                  - listitem [ref=f63e182]: геморой.
                - paragraph [ref=f63e183]: Крім різних патологій стравоходу, шлунка, кишечника позитивний результат аналізу калу на приховану кров може бути пов'язаний з носовою кровотечею, кровоточивістю ясен і іншими стоматологічними проблемами. Хибнопозитивний результат можливий внаслідок порушення правил підготовки до аналізу калу на приховану кров, вживання низки медикаментів і продуктів харчування.
                - heading "Що слід знати, готуючись до аналізу калу на приховану кров" [level=2] [ref=f63e184]
                - paragraph [ref=f63e185]: "Для отримання достовірних результатів аналізу калу на приховану кров необхідно дотримуватися кількох правил:"
                - list [ref=f63e186]:
                  - listitem [ref=f63e187]: за 3 доби до здачі аналізу калу на приховану кров не приймайте ліків, що містять вісмут і залізо, також відмовтеся від проносних, препаратів, які впливають не перистальтику кишечника, нестероїдних протизапальних, аскорбінової кислоти;
                  - listitem [ref=f63e188]: протягом цього ж періоду не робіть клізми, не використовуйте ректальні супозиторії;
                  - listitem [ref=f63e189]: за 3 дні до дати, на яку призначений аналіз калу на приховану кров, виключіть зі свого меню м'ясо, печінку й абсолютно всі продукти, в складі яких є залізо (деякі з них – це яблука, перець, шпинат, квасоля, цибуля);
                  - listitem [ref=f63e190]: якщо вам призначена інструментальна діагностика шлунково-кишкового тракту, аналіз калу на приховану кров повинен передувати її проведенню;
                  - listitem [ref=f63e191]: зберіть матеріал в чистий контейнер і доставте в лабораторію.
                - heading "Переваги проведення аналізу калу на приховану кров в лабораторії NIKOLAB" [level=2] [ref=f63e192]
                - paragraph [ref=f63e193]: Головною метою медичної лабораторії NIKOLAB у місті Київ є допомога пацієнту в питаннях діагностики захворювань. Для проведення аналізу калу на приховану кров (проби Грегерсена) використовуються сертифіковані реактиви від провідних постачальників. Звертаючись до фахівців лабораторії, Ви отримуєте якісний сервіс за доступними цінами, який стане вашою надійною підтримкою на шляху до одужання. Результати аналізу калу на приховану кров можна отримати вже через день після здачі матеріалу для дослідження.
