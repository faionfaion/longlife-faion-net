                              - cell "ВАРІЛРИКС™/VARILRIX™ ВАКЦИНА ДЛЯ ПРОФІЛАКТИКИ ВІТРЯНОЇ ВІСПИ ЖИВА АТЕНУЙОВАНА ліофілізат для розчину для ін'єкцій по 1 дозі; 1 флакон з ліофілізатом та 1 ампула з розчинником (вода для ін'єкцій) в пластиковому контейнері в картонній коробці; 1 флакон з ліофілізатом та 1 попередньо наповнений шприц з розчинником (вода для ін'єкцій) у комплекті з двома голками в пластиковому контейнері в картонній коробці; 100 флаконів з ліофілізатом та 100 ампул з розчинником (вода для ін'єкцій) (в чарунковій упаковці) в окремих картонних коробках" [ref=f1e179]: ВАРІЛРИКС™/VARILRIX™ ВАКЦИНА ДЛЯ ПРОФІЛАКТИКИ ВІТРЯНОЇ ВІСПИ ЖИВА АТЕНУЙОВАНАліофілізат для розчину для ін'єкцій по 1 дозі; 1 флакон з ліофілізатом та 1 ампула з розчинником (вода для ін'єкцій) в пластиковому контейнері в картонній коробці; 1 флакон з ліофілізатом та 1 попередньо наповнений шприц з розчинником (вода для ін'єкцій) у комплекті з двома голками в пластиковому контейнері в картонній коробці; 100 флаконів з ліофілізатом та 100 ампул з розчинником (вода для ін'єкцій) (в чарунковій упаковці) в окремих картонних коробках
