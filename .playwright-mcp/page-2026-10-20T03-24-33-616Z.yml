                  - generic [ref=f36e433]: Опис Вітамін Д3 Vitamin D-3 10000 120 капс. (36128161)
                  - generic [ref=f36e436]:
                    - text: "Вітамін Д3 Now - повноцінне джерело для здоров'я Знаменита американська компанія Now Foods рада представити своїм шанувальникам та всім прихильникам здорового способу життя унікальний продукт, призначений для комплексної підтримки здоров'я опорно-рухової системи та зміцнення імунітету. Vitamin D-3 10000 допоможе спортсменам та активним людям уникнути травм, посилити природний захист організму від хвороб, підтримувати здорове вироблення гормонів. Основу представленого продукту склав вітамін D3. Головною функцією цього ключового мікроелемента є оптимізація всмоктування кальцію із кишечника. Незважаючи на те, що організм здатний синтезувати його під впливом сонячних променів, а також отримувати із звичайної їжі, найчастіше цих джерел недостатньо для повноцінного підживлення організму людей, які проживають у наших широтах. Справа в тому, що найбільша концентрація вітаміну Д міститься в риб'ячому жирі, печінці тріски, оселедця та інших морепродуктах, яких вкрай мало в раціоні харчування сучасної людини. Коли ж мова йде про сонячне світло, то очевидно, що наш організм недоотримує його, особливо в осінньо-зимовий період. Ось чому так важливо приймати цей вітамін зі спеціалізованих доповнень дієти. Серед позитивних ефектів від використання даного продукту варто виділити: • підтримує здорову мінералізацію кісткової тканини; • зміцнює опорно-рухову систему; • підвищує щільність м'язової тканини; • позитивно впливає на швидкість роботи головного мозку; • знижує ризик захворювання на ГРВІ та грип; /> • підтримує здоровий синтез гормонів, у тому числі і анаболічних; • благотворно впливає на стан шкіри.Чому вітамін Д3 такий важливий для спортсменів? Причина – регулярні фізичні навантаження, які виснажують запаси кальцію в організмі і викликають вимивання цього мінералу з кісткової тканини, сприяючи зниженню міцності та пружності кісток, підвищенню їх крихкості та ламкості. Крім цього, значний дефіцит кальцію в організмі може спровокувати розвиток остеопорозу. Безумовно, для усунення такого дефіциту необхідно приймати достатню кількість цього мінералу, але для його правильного засвоєння необхідний вітамін D3. Представлений продукт виробляється у зручній для прийому формі біодоступних софтгелевих капсул. Він повністю універсальний, не містить ГМО і алергенів, чудово підходить як атлетам, так і особам, які зовсім не пов'язані зі спортом, проте, всерйоз піклуються про власне здоров'я. Зміцніть імунітет і захистіть себе від травм, залишаючись активними та повними сил, разом з Now Foods Vitamin D-3 10000!Склад:"
                    - generic [ref=f36e437]: "Склад на порцію - 1 капсулу: b> Вітамін D3 (як холекальциферол) (з ланоліну) 10000 МОІнші інгредієнти: капсула (желатин, вода, гліцерин) та органічна оливкова олія найвищої якості. Не виробляється з додаванням дріжджів, пшениці, клейковини, сої, молока, яєць, риби чи молюсків. Виготовляється в установці GMP, яка обробляє інші інгредієнти, що містять ці алергени. лікаря. Попередження: Не використовувати, якщо у вас алергія на якесь із сполук. Не перевищувати добову дозу, що рекомендується. Проконсультуйтеся з лікарем під час вагітності або лактації. Харчові добавки не повинні використовуватися замість різноманітної та збалансованої дієти. Зберігати у недоступному для дітей місці. Зберігати у сухому та прохолодному місці. Захищати від прямих сонячних променів."
