              - generic [ref=f64e150]:
                - paragraph [ref=f64e151]: Аналіз калу на трансферин і гемоглобін є якісним дослідженням, застосовуваним для виявлення прихованої кровотечі в шлунково-кишковому тракті (ШКТ). Цей вид кровотечі може бути викликаний багатьма причинами, такими як виразкова хвороба шлунка або дванадцятипалої кишки, рак шлунка, ерозії стравоходу, запальні захворювання кишечника та інші патологічні стани.
                - paragraph [ref=f64e152]: Трансферин — це глікозильований білок, що транспортує залізо в крові, синтезований у печінці. Він складається з двох субодиниць і має здатність міцного, але оборотного зв’язування з іонами заліза. Трансферин зв’язується з залізом у кістковому мозку для синтезу гемоглобіну. На відміну від гемоглобіну, трансферин більш стійкий до впливу травних ферментів, тому його присутність у калі більш ймовірна при прихованій кровотечі, навіть якщо кровотеча незначна. Прихована кровотеча в ШКТ часто призводить до розвитку анемії, що проявляється слабкістю, задишкою, запамороченням і блідістю шкірних покривів. Крім того, специфічними ознаками прихованої кровотечі можуть бути чорний кал (мелена) і наявність прожилок крові в калі.
                - paragraph [ref=f64e153]: Гемоглобін — це основний компонент еритроцитів, відповідальний за перенос кисню від легень до тканин і зворотній транспорт вуглекислого газу. Структурно гемоглобін складається з гемової частини, що містить залізо, і протеїнової частини. Залізо в гемовій групі зв’язується з киснем, формуючи оксигемоглобін, який доставляє кисень тканинам, і з вуглекислим газом, утворюючи карбогемоглобін, який виводить вуглекислий газ у легені. В нормі гемоглобін у калі відсутній, оскільки еритроцити руйнуються в ШКТ, а компоненти не потрапляють у кал. При пошкодженні слизової і кровотечі гемоглобін може бути присутнім у фекаліях.
                - paragraph [ref=f64e154]: Аналіз калу використовується як у рамках профілактичних оглядів, так і при появі симптомів, що вказують на можливу кровотечу. Показаннями для проведення дослідження є прояви анемії, чорний кал або наявність крові в калі, вік понад 50 років, високий ризик розвитку раку шлунка та інших захворювань ШКТ, а також підозра на кровотечу після операцій або прийом ліків, здатних викликати пошкодження слизової.
                - paragraph [ref=f64e155]: Підготовка до аналізу — за кілька днів до дослідження з раціону виключають продукти, багаті на залізо, такі як червоне м’ясо, печінка, шпинат і бобові. Також припиняють прийом ліків, що впливають на результати, наприклад, аспірину і нестероїдних протизапальних препаратів. Важливо відмовитися від вживання проносних засобів, алкоголю, а також продуктів, здатних змінити колір калу. Збір матеріалу проводять у стерильний контейнер, доставляючи його до лабораторії того ж дня. Для аналізу беруть зразок калу з різних ділянок, загальною вагою близько 10–15 грамів.
                - paragraph [ref=f64e156]: Інтерпретація аналізу базується на наявності або відсутності в калі трансферину і гемоглобіну. Позитивний результат свідчить про приховану кровотечу, що вимагає подальшого обстеження для визначення її джерела. Негативний результат вказує на відсутність кровотечі в ШКТ на момент дослідження.
                - paragraph [ref=f64e157]: Аналіз калу на трансферин та гемоглобін (якісне дослідження) – це аналіз, який використовується для виявлення прихованої кровотечі у шлунково-кишковому тракті (ШКТ). Воно може бути викликано різними причинами, включаючи виразку шлунка та/або дванадцятипалої кишки, рак шлунка, ерозію стравоходу, запальні захворювання кишківника (ЗЗК) та інші захворювання.
                - paragraph [ref=f64e158]: Трансферин – це білок, що транспортує залізо у крові, а гемоглобін – це білок, який містить залізо та переносить кисень у крові. Обидва білки можуть виділятися з фекаліями при прихованій кровотечі.
                - 'heading "Трансферин та гемоглобін: опис" [level=2] [ref=f64e159]'
                - paragraph [ref=f64e160]: Трансферин – це білок, який міститься у крові та переносить залізо. Він відіграє роль у перенесенні заліза до органів, де воно використовується.
                - paragraph [ref=f64e161]: Трансферин є глікозильованим білком, який міцно, але оборотно зв'язує іони заліза. Він складається з двох субодиниць і виробляється у печінці, після чого вивільняється у кров. Білок зв'язується із залізом у кістковому мозку, де він використовується для синтезу гемоглобіну.
                - paragraph [ref=f64e162]: Трансферин може проникати у шлунково-кишковий тракт під час кровотечі, і тоді його виявляють у калі. При цьому кровотеча може бути як незначною, так і значною.
                - paragraph [ref=f64e163]: Цей білок стабільніший, ніж гемоглобін, до травних ферментів. Тому при шлунково-кишковій кровотечі в калі частіше виявляється трансферин, ніж гемоглобін.
                - paragraph [ref=f64e164]: "Прихована кровотеча може бути викликана різними причинами, включаючи:"
                - list [ref=f64e165]:
                  - listitem [ref=f64e166]: виразку шлунка;
                  - listitem [ref=f64e167]: рак шлунка;
                  - listitem [ref=f64e168]: ерозію стравоходу;
                  - listitem [ref=f64e169]: запальні захворювання кишківника (ЗЗК);
                  - listitem [ref=f64e170]: варикозну хворобу вен стравоходу;
                  - listitem [ref=f64e171]: геморой;
                  - listitem [ref=f64e172]: поліпи кишківника;
                  - listitem [ref=f64e173]: аневризму аорти.
                - paragraph [ref=f64e174]: "Прихована кровотеча часто призводить до розвитку анемії, симптоми якої й приводять людину до кабінету лікаря. Клініка анемії:"
                - list [ref=f64e175]:
                  - listitem [ref=f64e176]: втома;
                  - listitem [ref=f64e177]: задишка;
                  - listitem [ref=f64e178]: запаморочення;
                  - listitem [ref=f64e179]: блідість шкірних покривів.
                - paragraph [ref=f64e180]: Також симптомами прихованої кровотечі є чорний кал (мелена) і дрібні прожилки крові в стільці.
                - paragraph [ref=f64e181]: Гемоглобін – це білок, який міститься в еритроцитах та відповідає за перенесення кисню з легень до тканин та вуглекислого газу з тканин у легені. Він є складним білком, що складається з двох частин гему (порфіринове кільце, яке містить залізо) і протеїну (білок, що зв'язує гем). Гемоглобін виробляється у кістковому мозку.
                - paragraph [ref=f64e182]: Залізо у гемі зв'язується з киснем, утворюючи оксигемоглобін, який своєю чергою переносить кисень до тканин, де він вивільняється. Вуглекислий газ з тканин зв'язується з гемоглобіном, утворюючи карбгемоглобін, який переносить вуглекислий газ у легені, де він вивільняється.
                - paragraph [ref=f64e183]: Гемоглобін відіграє важливу роль у здоров'ї людини, але він у нормі не повинен визначатися в калі.
                - paragraph [ref=f64e184]: Гемоглобін може бути присутнім у калі за наявності кровотечі у шлунково-кишковому тракті (ШКТ). Це пов'язано з тим, що еритроцити, які містять гемоглобін, руйнуються в шлунково-кишковому тракті та їх компоненти виводяться з калом.
                - heading "Особливості дослідження" [level=2] [ref=f64e185]
                - paragraph [ref=f64e186]: Аналіз калу на трансферин та гемоглобін (якісне дослідження) є простим та ефективним методом діагностики прихованої кровотечі в ШКТ. Цей аналіз може проводитися в рамках профілактичних обстежень, а також за наявності симптомів, які можуть свідчити про приховану кровотечу.
                - heading "Коли та навіщо призначають аналіз" [level=2] [ref=f64e187]
                - paragraph [ref=f64e188]: "Показання до проведення аналізу калу на трансферин та гемоглобін (якісне дослідження):"
                - list [ref=f64e189]:
                  - listitem [ref=f64e190]: симптоми анемії;
                  - listitem [ref=f64e191]: чорний стілець або прожилки крові у калі;
                  - listitem [ref=f64e192]: як профілактика пацієнтам старше 50 років;
                  - listitem [ref=f64e193]: пацієнти з високим ризиком розвитку раку шлунка або інших захворювань шлунково-кишкового тракту;
                  - listitem [ref=f64e194]: підозра на шлунково-кишкову кровотечу після хірургічного втручання;
                  - listitem [ref=f64e195]: підозра на шлунково-кишкову кровотечу після приймання лікарських препаратів;
                  - listitem [ref=f64e196]: підозра на приховану кровотечу внаслідок деяких патологій (рак, виразка та ін.).
                - paragraph [ref=f64e197]: "Дослідження потрібне для:"
                - list [ref=f64e198]:
                  - listitem [ref=f64e199]: виявлення прихованої кровотечі;
                  - listitem [ref=f64e200]: постановки діагнозу;
                  - listitem [ref=f64e201]: проведення диференціальної діагностики
                - paragraph [ref=f64e202]: "Призначають аналіз калу на трансферин та гемоглобін: гастроентерологи, педіатри, хірурги, терапевти та сімейні лікарі."
                - heading "Правила підготовки" [level=2] [ref=f64e203]
                - paragraph [ref=f64e204]: "Щоб уникнути хибних результатів, необхідно дотримуватись наступних правил перед проведенням аналізу калу на приховану кров:"
                - list [ref=f64e205]:
                  - listitem [ref=f64e206]: за 3 дні до аналізу виключити з раціону продукти, багаті на залізо, такі як червоне м'ясо, печінку, печінкові продукти, шпинат, бобові та листові овочі;
                  - listitem [ref=f64e207]: за 2 дні до аналізу припинити приймання ліків, які можуть вплинути на результати аналізу, таких як аспірин, нестероїдні протизапальні препарати (НПЗП) та препарати заліза.
                  - listitem [ref=f64e208]: за 1 день виключити вживання проносних засобів та алкоголю;
                  - listitem [ref=f64e209]: за 3 дні припинити використання свічок, супозиторіїв, олії та приймання інших медикаментів, що впливають на перистальтику кишківника;
                  - listitem [ref=f64e210]: за 1 день відмовитися від вживання продуктів харчування, які можуть поміняти колір калу (морква, буряк та ін.).
                - paragraph [ref=f64e211]: Для збору калу слід використовувати одноразовий контейнер, який можна придбати в аптеці або лабораторії Nikolab.
                - paragraph [ref=f64e212]: Сам збір калу необхідно здійснити в стерильний контейнер і доставити зразок у відділення Nikolab протягом цього ж дня. Достатньо взяти зразок з різних ділянок загальним обсягом 10-15 грам.
                - paragraph [ref=f64e213]: Деякі захворювання, такі як цироз печінки, можуть викликати підвищений вміст трансферину в калі, що може призвести до хибнопозитивного результату аналізу. А діарея може прискорити проходження калу через шлунково-кишковий тракт, що може призвести до того, що еритроцити не встигнуть зруйнуватися і їх компоненти не потраплять у кал. Це призведе до хибного результату.
                - heading "Інтерпретація результатів" [level=2] [ref=f64e214]
                - paragraph [ref=f64e215]: Позитивний результат на якісне дослідження калу на трансферин та гемоглобін свідчить про наявність прихованої кровотечі у шлунково-кишковому тракті.
                - paragraph [ref=f64e216]: Негативний результат на аналіз означає, що прихована кровотеча в шлунково-кишковому тракті відсутня.
                - heading "Важливі примітки" [level=2] [ref=f64e217]
                - paragraph [ref=f64e218]: "При отриманні позитивної відповіді калу на скриту кров не варто розцінювати її як остаточний діагноз. Необхідно провести додаткові дослідження для уточнення джерела кровотечі. Але вони повинні бути призначені лікарем. Найчастіше до них відносяться: фіброезофагогастродуоденоскопія (ФЕГДС), колоноскопія та рентгенографія ШКТ з контрастною речовиною. Тільки після комплексного обстеження можна говорити про точний діагноз та призначення лікування."
