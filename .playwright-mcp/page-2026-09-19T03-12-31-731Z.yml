        - listitem [ref=f4e243]:
          - paragraph [ref=f4e244]: загальний аналіз сечі;
        - listitem [ref=f4e245]:
          - paragraph [ref=f4e246]: кал на приховану кров;
        - listitem [ref=f4e247]:
          - paragraph [ref=f4e248]: швидкі тести;
        - listitem [ref=f4e249]:
