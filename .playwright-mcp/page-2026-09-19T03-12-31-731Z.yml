          - paragraph [ref=f4e236]: "гострофазові показники: С-реактивний білок (CРБ), прокальцитонін);"
        - listitem [ref=f4e237]:
          - paragraph [ref=f4e238]: коагуляційний гемостаз (тромбіновий час, активований частковий (парціальний) тромбопластиновий час (АЧТЧ, АПТЧ), фібриноген, міжнародне нормалізоване відношення (МНВ), D-димер);
        - listitem [ref=f4e239]:
