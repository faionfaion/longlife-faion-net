      - paragraph [ref=f4e224]: Забезпечення надання медичної допомоги методами і засобами телемедицини (телеконсультування/телевідеоконсультування у режимі реального або відкладеного часу, теледіагностики, спостереження у режимі віддаленого моніторингу, телеметрії) разом з обстеженням та із застосуванням інших методів, що не суперечать законодавству.
      - paragraph [ref=f4e225]: "Дотримання принципів безбар’єрності та інклюзії при наданні медичної допомоги, у тому числі з використанням методів і засобів телемедицини відповідно до нормативно- правових актів.Додаткові вимоги до обсягу медичних послуг, який надавач зобов’язується надавати за договором відповідно до медичних потреб пацієнта/пацієнтки (специфікація):"
      - paragraph [ref=f4e226]: Надання цілодобової медичної допомоги пацієнту/пацієнтці у приймальному відділенні/відділенні екстреної та невідкладної допомоги/травмпункті.
      - paragraph [ref=f4e227]: "Цілодобове проведення лабораторних досліджень, зокрема:"
      - list [ref=f4e228]:
        - listitem [ref=f4e229]:
          - paragraph [ref=f4e230]: розгорнутий клінічний аналіз крові;
        - listitem [ref=f4e231]:
          - paragraph [ref=f4e232]: визначення групи крові і резус-фактора;
        - listitem [ref=f4e233]:
          - paragraph [ref=f4e234]: "біохімічний аналіз крові (загальний білок, альбумін, альфа-амілаза, аспартатамінотрансфераза (АсАТ), аланінамінотрансфераза (АлАТ), білірубін і його фракції (загальний, прямий, непрямий), креатинін, сечовина, електроліти: калій, кальцій, хлор, натрій, магній; лужна фосфатаза, лактатдегідрогеназа,); гама-глутамілтранспептидаза; креатинфосфокіназа загальна (КФК); креатинфосфокиназа-МВ;"
