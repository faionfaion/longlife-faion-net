      - paragraph [ref=f4e99]: «Процедури» для класу «Амбулаторна хірургія», «Анестезіологічне забезпечення», «Інтервенційна візуалізація») або за пакетом медичних послуг «Хірургічні операції дорослим та дітям в умовах стаціонару одного дня».
      - paragraph [ref=f4e100]:
