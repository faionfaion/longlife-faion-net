        - text: – консультування, спостереження за пацієнтками до та/або після лікування злоякісних новоутворень репродуктивного тракту, включаючи шийку матки, ендометрій, маткові труби, яєчники, матку та піхву, скринінг гінекологічних злоякісних новоутворень. Включає навчання пацієнтки з метою покращення її знань, усвідомлення та розуміння своєї хвороби, а також надання рекомендацій із запобігання розвитку ускладнень.
