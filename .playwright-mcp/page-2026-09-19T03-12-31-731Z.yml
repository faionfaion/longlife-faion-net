          - paragraph [ref=f4e258]: ультразвукові дослідження, зокрема, із проведенням доплерографії;
        - listitem [ref=f4e259]:
          - paragraph [ref=f4e260]: ендоскопічні дослідження;
        - listitem [ref=f4e261]:
          - paragraph [ref=f4e262]: електрокардіографія (ЕКГ);
        - listitem [ref=f4e263]:
          - paragraph [ref=f4e264]: інші інструментальні дослідження відповідно до галузевих стандартів.
      - paragraph [ref=f4e265]:
        - strong [ref=f4e266]: Умови закупівлі медичних послуг
      - paragraph [ref=f4e267]: "Умови надання послуги: амбулаторно (зокрема, в умовах приймального відділення/відділенні екстреної та невідкладної допомоги/травмпункті), за місцем проживання (перебування) пацієнта/пацієнтки при наявності медичних показань (за рішенням лікуючого лікаря- спеціаліста) або з використанням засобів телекомунікації."
      - paragraph [ref=f4e268]: "Підстави надання послуги:"
      - list [ref=f4e269]:
        - listitem [ref=f4e270]:
          - paragraph [ref=f4e271]: направлення лікаря з надання ПМД, якого обрано за декларацією про вибір лікаря;
        - listitem [ref=f4e272]:
          - paragraph [ref=f4e273]: направлення лікуючого лікаря-спеціаліста;
        - listitem [ref=f4e274]:
          - paragraph [ref=f4e275]: самозвернення до лікаря-акушера-гінеколога, лікаря-гінеколога дитячого та підліткового віку, лікаря-педіатра, лікаря-нарколога, лікаря-фтизіатра, лікаря- фтизіатра дитячого;
        - listitem [ref=f4e276]:
          - paragraph [ref=f4e277]:
            - strong [ref=f4e278]: самозвернення до лікаря-психолога, лікаря-психіатра, лікаря-психіатра дитячого, лікаря-психіатра підліткового, лікаря-психотерапевта, клінічного психолога - для закладів, в яких відсутній договір за пакетом «Психосоціальна та психіатрична допомога дорослим та дітям, що надається в центрах ментального (психічного) здоров'я та мобільними мультидисциплінарними командами»;
        - listitem [ref=f4e279]:
          - paragraph [ref=f4e280]: самозвернення до лікаря-спеціаліста, у якого пацієнт/пацієнтка із хронічними захворюваннями перебуває під медичним наглядом;
        - listitem [ref=f4e281]:
          - paragraph [ref=f4e282]: самозвернення у невідкладному стані.
      - paragraph [ref=f4e283]: "Додаткові підстави надання послуги:"
      - list [ref=f4e284]:
        - listitem [ref=f4e285]:
          - paragraph [ref=f4e286]: доставлення бригадою екстреної (швидкої) медичної допомоги;
        - listitem [ref=f4e287]:
          - paragraph [ref=f4e288]: самозвернення у невідкладному стані;
        - listitem [ref=f4e289]:
          - paragraph [ref=f4e290]:
            - text: направлення лікуючим лікарем пацієнтів за групами захворювань, викладених у
            - strong [ref=f4e291]: Додатку 2.
