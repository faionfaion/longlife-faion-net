              - /url: javascript:void(0)
      - heading "Безоплатні послуги в Програмі медичних гарантій 2026" [level=1] [ref=f5e27]
    - generic [ref=f5e28]:
      - generic [ref=f5e29]:
        - paragraph [ref=f5e30]:
          - strong [ref=f5e31]: БЕЗОПЛАТНІ ПОСЛУГИ В ПРОГРАМІ МЕДИЧНИХ ГАРАНТІЙ 2026
          - text: Програма медичних гарантій (ПМГ) – це перелік медичних послуг та ліків, які держава гарантує українцям безоплатно. Оплачує ці медичні послуги для громадян Національна служба здоров’я України, укладаючи договори з лікарнями.Кожен громадянин, незалежно від рівня доходів, соціального статусу, місця реєстрації, може отримати безоплатно однаковий обсяг медичних послуг у будь-якій лікарні країни, яка має договір з НСЗУ. Універсальність та екстериторіальність – це головні принципи Програми медичних гарантій.
        - paragraph [ref=f5e32]:
          - text: ПМГ-2026 складається з 46 пакетів медичних послуг, які охоплюють усі види та рівні медичної допомоги:-
          - link "Екстрена медична допомога" [ref=f5e33] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/ekstrena-medicna-dopomoga-1
          - text: "-"
          - link "Первинна медична допомога" [ref=f5e34] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/dopomoga-na-pervinnomu-medicnomu-rivni-1
          - text: "-"
          - link "Послуги у сфері громадського здоров’я" [ref=f5e35] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/gromadske-zdorovia-1
          - text: (діагностика та лікування ВІЛ, туберкульозу у стаціонарних умовах, психіатрична допомога у стаціонарних умовах та мобільні дисциплінарні команди, замісна підтримувальна терапія)-
          - link "Амбулаторні послуги" [ref=f5e36] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/ambulatorni-poslugi-1
          - text: (профілактика, діагностика, спостереження та лікування в амбулаторних умовах, ведення вагітності, стоматологічна допомога, послуги з раннього виявлення онкологічних захворювань, лікування методом гемодіалізу, лікування методом перитонеального діалізу)-
          - link "Стаціонарні послуги" [ref=f5e37] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/stacionarni-poslugi-1
          - text: (стаціонарна медична допомога з та без проведення хірургічних операцій, лікування онкологічних захворювань)-
          - link "Пріоритетні стаціонарні послуги" [ref=f5e38] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/prioritetni-stacionarni-poslugi-1
          - text: (Медична допомога при пологах, допомога новонародженим у складних неонатальних випадках, медична допомога при інфарктах та інсультах)-
          - link "Реабілітаційна допомога" [ref=f5e39] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/reabilitaciina-dopomoga-1
          - text: (реабілітація немовлят, які народилися передчасно або хворими протягом перших трьох років життя, стаціонарна та амбулаторна реабілітація дорослих та дітей)-
          - link "Паліативна допомога" [ref=f5e40] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/paliativna-dopomoga-1
          - text: (стаціонарна та мобільна)-
          - link "Лікування безпліддя" [ref=f5e41] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/likuvannia-bezpliddia
          - text: ( Лікування безпліддя за допомогою допоміжних репродуктивних технологій (запліднення іn vitro))-
          - link "Трансплантація" [ref=f5e42] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/transplantaciia
          - text: "-"
          - link "Безоплатне зубопротезування та -лікування для захисників і захисниць" [ref=f5e43] [cursor=pointer]:
            - /url: /gromadianam/bezoplatni-poslugi-v-programi-medicnix-garantii-20-1/bezoplatne-zuboprotezuvannia-ta-likuvannia-dlia-zaxis
          - text: НСЗУ закуповує медичні послуги в державних, комунальних і приватних медзакладах для всіх українців і наша мета полягає в тому, щоб пацієнт знав про гарантований державою обсяг послуг і правила отримання медичної допомоги, а надавач - розумів свої можливості і відповідальність.Дізнатися, які медичні заклади надають медичні послуги за договором із НСЗУ можна на
          - link "Електронній карті місць надання послуг за Програмою медичних гарантій" [ref=f5e44] [cursor=pointer]:
            - /url: https://nszu.gov.ua/dashboards/elektronna-karta-misc-nadannia-poslug-za-programoiu
          - text: (користуйтеся підказками в описі під картою щодо користування інформаційною панеллю).
          - strong [ref=f5e45]: Правила отримання медичної допомоги за Програмою медичних гарантій
          - text: для всіх однакові, незалежно від соціального статусу, матеріального становища тощо.
          - strong [ref=f5e46]: Медичні послуги, які закуповує НСЗУ за Програмою медичних гарантій, повністю безоплатні для пацієнтів, включно з лікарськими засобами та витратними матеріалами.
          - generic [ref=f5e47]:
            - text: Доступ до більшості безоплатних послуг відкривається через
            - strong [ref=f5e48]: декларацію з лікарем первинної медичної допомоги
            - text: ": сімейним лікарем, терапевтом або педіатром для дитини. У разі необхідності лікар створить електронне направлення на консультацію до лікаря- спеціаліста, обстеження тощо. З направленням пацієнт може вільно обирати заклад, в якому пройти обстеження чи лікування."
          - text: Однак електронне
          - strong [ref=f5e49]: направлення не потрібне
          - text: для отримання екстреної медичної допомоги. А також при зверненні до гінеколога, психіатра, нарколога, стоматолога, фтизіатра, педіатра або лікаря, у якого пацієнт перебуває під наглядом із хронічним захворюванням.Щороку перелік безоплатних медичних послуг деталізується та розширюється в інтересах пацієнтів.
